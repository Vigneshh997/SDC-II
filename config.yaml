# Supply an authorized, reviewed dataset. This path intentionally does not exist.
manifest: backend/data/paired/manifest.jsonl
provenance_review: backend/data/paired/PROVENANCE_REVIEW.md
seed: 42
batch_size: 4
num_workers: 0
max_epochs: 12
patience: 5
lr: 0.0001
weight_decay: 0.00001
temperature: 0.07
contrastive_weight: 0.1
gradient_clip: 1.0
mixed_precision: true
device: auto
local_files_only: false
output_dir: outputs/xfusion_v2
model:
  clahe: true
  metadata_fields: [age, sex]
  d_model: 512
  nhead: 8
  num_layers: 2
  freeze_vision: true
  freeze_text: true
